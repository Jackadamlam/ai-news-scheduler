name: Daily AI News

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: Daily News
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Daily News/requirements.txt'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create output directories
      run: |
        mkdir -p output logs data
        
    - name: Run news scheduler
      run: python main.py --once
      env:
        TZ: Asia/Shanghai
        MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      
    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 Update AI news"
        branch: main
        pull_options: "--rebase"
